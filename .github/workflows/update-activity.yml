name: Refresh activity snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Refresh activity.json
        run: python3 scripts/update_activity.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- activity.json)" ]; then
            echo "Activity snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
